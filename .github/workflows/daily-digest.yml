name: Daily Web3 vacancy digest

on:
  schedule:
    # 10:00 Europe/Moscow (UTC+3). GitHub Actions cron uses UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the Telegram Serverless digest
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud run handlers/chosen_inline_result '{}'
